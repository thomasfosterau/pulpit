# Every external version lives here (`catalogMode: strict`); package.json files
# use `catalog:`, `catalog:peers` or `workspace:`. `effect` must be a singleton.
packages:
  - packages/*
  - tests/*

catalogMode: strict

catalog:
  "@changesets/changelog-github": ^1.0.1
  "@changesets/cli": ^3.0.3
  "@effect/docgen": ^4.1.4
  "@effect/language-service": ^0.87.5
  # Dev-only, for pulpit-drizzle-pg's integration setup; moves with `effect`.
  "@effect/platform-node": 4.1.4
  # effect-drizzle-ext-pg's required peer, for pulpit-drizzle-pg's tests; moves with `effect`.
  "@effect/sql-pg": 4.1.4
  "@enfect/oxlint": ^0.10.0
  # Patches `@typescript/native` and vite-plus's oxlint; moves with both (see its `components` table).
  "@effect/tsgo": 0.69.0
  "@thomasfosterau/effect-drizzle-ext": ^0.5.0
  "@thomasfosterau/effect-drizzle-ext-pg": ^0.5.0
  "@thomasfosterau/effect-jsonapi": ^0.22.1
  "@thomasfosterau/effect-auth": ^0.5.2
  "@types/node": ^26.6.6
  # Must equal the vitest vite-plus bundles.
  "@vitest/coverage-istanbul": 5.1.0
  # Exact: a release candidate; effect-drizzle-ext is built against it. Kit and ORM move together.
  drizzle-orm: 1.0.0-rc.5
  drizzle-kit: 1.0.0-rc.5
  effect: 4.1.4
  fallow: 3.43.2
  # Only for @effect/docgen, which spawns it.
  tsx: ^4.23.13
  # TS6 for JS-API consumers (docgen, editors); `@typescript/native` is TS7.
  typescript: "npm:@typescript/typescript6@6.0.2"
  "@typescript/native": "npm:typescript@7.0.2"
  # `vite`, `vitest` and the devcontainer image tag follow vite-plus.
  vite-plus: 1.6.0
  vite: npm:@voidzero-dev/vite-plus-core@1.6.0
  vitest: 5.1.0

# Published peer ranges (the adapters peer on the kernel with `workspace:^`).
catalogs:
  peers:
    # 0.3.0 is the first release with the access predicates the kernel delegates to.
    "@thomasfosterau/effect-auth": ">=0.3.0"
    # effect-drizzle-ext 0.3.0 is the first `executeRows` that decodes rows with a schema.
    "@thomasfosterau/effect-drizzle-ext": ">=0.3.0"
    "@thomasfosterau/effect-drizzle-ext-pg": ">=0.2.0"
    "@thomasfosterau/effect-jsonapi": ">=0.20.0"
    # Raised from ^4.0.0: effect-auth peers on effect ^4.1.0.
    effect: ^4.1.0
    drizzle-orm: ">=1.0.0-rc.5"

overrides:
  effect: "catalog:"
  vite: "catalog:"
  vitest: "catalog:"
nodeLinker: hoisted
allowBuilds:
  esbuild: true
  fallow: true
  msgpackr-extract: true
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
# Supply-chain delay, in minutes.
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - "@thomasfosterau/*"
