# pnpm workspace — two packages under `packages/*`, the published kernel
# (`packages/pulpit`, `@thomasfosterau/pulpit`) and its WordPress-compatible
# read API (`packages/pulpit-wordpress`, `@thomasfosterau/pulpit-wordpress`,
# private until its publishing is set up), plus the private dist-consumer
# declaration check of both under `tests/*`.
#
# The `catalog:` protocol pins versions that MUST be singletons across the
# workspace. Effect especially: two copies of `effect` break Context / Layer /
# Schema identity at runtime, so every package references `catalog:`.
#
# EVERY external dependency version lives here — package.json files reference
# only `catalog:` / `catalog:peers` (or `workspace:*` for internal packages).
# `catalogMode: strict` makes `pnpm add` enforce this at add time and
# `pnpm install` reject non-catalog specifiers. After editing this catalog,
# ALWAYS run `pnpm install` and commit the regenerated pnpm-lock.yaml — a stale
# lockfile fails CI at once with ERR_PNPM_LOCKFILE_CONFIG_MISMATCH.
#
# Versions are kept in lockstep with the consuming applications' catalogs
# (the freshest, preferenceflow's, at scaffold time: effect, the TypeScript
# 6/7 pair, fallow; vite-plus and @effect/tsgo have since moved ahead of them) — the
# apps consume this library, so the library builds against exactly what they
# run.
packages:
  - packages/*
  - tests/*

catalogMode: strict

catalog:
  "@changesets/changelog-github": ^1.0.1
  "@changesets/cli": ^3.0.3
  # Compiles AND executes every JSDoc `@example` (`vp run -r docgen`): parses
  # `src/` with `ts-morph` (and the TypeScript 6.0 that ts-morph 28 bundles),
  # type-checks the examples with the `tsc` on PATH (the native one below) and
  # runs them under `tsx`, hence that entry. Its `typescript >=5.8.2 <7` peer
  # is met by the TS6 alias below, so it needs no `peerDependencyRules` entry.
  "@effect/docgen": ^4.0.6
  "@effect/language-service": ^0.87.5
  # Effect Language Service as a native (TypeScript-Go) binary — the TS7 side
  # of the 6/7 split. `effect-tsgo patch` overwrites the native `tsc` binary
  # with an Effect-patched build matched by gitHead, so this pins in lockstep
  # with `@typescript/native` below (0.55.0 ships against typescript 7.0.2,
  # 7.1.0-beta and 7.1.0-dev.20261020.3) and with the `oxlint` and
  # `oxlint-tsgolint` that `vite-plus` pulls in: each @effect/tsgo release
  # ships artifacts for an explicit set of component versions and hard-errors
  # (UnsupportedTargetPackageVersionError) on anything else, failing `pnpm
  # install` itself rather than a later task. 0.55.0 supports oxlint
  # 1.87.0–1.89.0 and oxlint-tsgolint 7.0.2003 / 7.0.2004, so vite-plus 1.3.0
  # (oxlint 1.88.0, tsgolint 7.0.2004) is the pairing; vite-plus 0.3.x
  # (oxlint 1.83.0) is no longer supported. Read the `components` table in
  # node_modules/@effect/tsgo/dist/effect-tsgo.cjs before bumping any of the
  # three.
  "@effect/tsgo": 0.57.0
  "@mpsuesser/oxlint-plugin-effect": ^0.6.0
  # The JSON:API model layer the `./content` and `./registry` subpaths build on.
  "@thomasfosterau/effect-jsonapi": ^0.19.0
  "@types/node": ^26.6.5
  # The coverage provider for `vp run -r test:coverage`. vite-plus bundles its
  # own vitest and refuses to start a coverage run unless the provider's
  # version EQUALS that bundled vitest exactly (`assertCoverageProviderVersionMatch`
  # in node_modules/vite-plus/dist/define-config-*.js), so this moves only with
  # vite-plus: pin it to the `vitest` entry below (vite-plus 1.3.0 → 5.0.5),
  # never ahead of it (pulpit#119).
  "@vitest/coverage-istanbul": 5.0.5
  effect: 4.0.5
  fallow: 3.36.0
  # The runtime `@effect/docgen` executes examples under.
  tsx: ^4.23.13
  # TypeScript 6/7 side-by-side: TS7 (the native Go compiler) ships no JS API
  # until 7.1, so JS-API consumers (@effect/language-service) stay on TS6 while
  # native `tsc` type-checks AND emits this library's `dist/`. The alias keeps
  # the package importable as `typescript` name-stable at the TS6 JS compiler
  # (bin `tsc6`); `@typescript/native` is TS7 (bin `tsc`). Pinned exact:
  # @typescript/native's gitHead must match @effect/tsgo's bundled binary.
  typescript: "npm:@typescript/typescript6@6.0.2"
  "@typescript/native": "npm:typescript@7.0.2"
  # vite-plus pins `oxlint`, `oxfmt`, `oxlint-tsgolint` and `vitest` to exact
  # versions, so this entry — not a catalog entry of its own — is what decides
  # the oxlint version `effect-tsgo patch --oxlint` has to support (see the
  # @effect/tsgo note above): 0.3.3 carries oxlint 1.83.0, 1.1.0 1.87.0, 1.3.0
  # 1.88.0. 1.x moved each task's `env` / `input` / `output` under `cache`
  # (vite.package.ts). `vite` is the same release under its aliased core
  # package, and `vitest` must match vite-plus's exact pin (1.3.0 → 5.0.5)
  # because the
  # `vitest: "catalog:"` override forces every resolution to the catalog
  # singleton, as must `@vitest/coverage-istanbul` (above).
  vite-plus: 1.4.0
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
  vitest: 5.0.5

# Peer ranges the packages under `packages/*` declare (the adapter's peer on
# the kernel is `workspace:^` instead). Kept as a named catalog so the
# strict catalog mode still governs them while they stay ranges (an exact
# `4.0.0-rc.118` peer would reject a consumer on a later prerelease). `pnpm publish`
# replaces `catalog:peers` with these ranges in each published manifest.
catalogs:
  peers:
    "@thomasfosterau/effect-jsonapi": ">=0.17.0"
    effect: ">=4.0.0-rc.118"

overrides:
  # undici <8.12.2 — GHSA-xjj6-f33q-929c (high): an unhandled error on a
  # response with excessive content-encodings is a denial of service
  # (#176). Reached transitively (@effect/platform-node > undici), whose
  # range admits the fix but whose lockfile resolution stayed below it.
  # Drop once that resolution reaches >=8.12.2 on its own.
  undici: ^8.12.2
  vite: "catalog:"
  vitest: "catalog:"
  # `effect` MUST be a singleton (see the header): force every resolution to
  # the catalog version so a hoisting reshuffle cannot introduce a second copy.
  effect: "catalog:"
  # Security floors for dev-only transitive tooling, so `pnpm audit
  # --audit-level high` passes (pulpit#41). Every parent's range already
  # admits the fixed release, so no catalog bump reaches them; the floor stops
  # a lockfile re-resolution from landing back on a vulnerable copy. `^`, not
  # `>=`, keeps each inside the major its parents ask for.
  # - shell-quote GHSA-pqg4-j6r4-53mv (critical), fixed in 1.11.0, via
  #   @changesets/cli > launch-editor (`^1.8.4`). Remove once launch-editor's
  #   own range floors at `^1.11.0`.
  # - source-map-js GHSA-68fv-2mgg-jv7q (high), fixed in 1.2.2, via postcss
  #   (under vite-plus-core) and magicast (`^1.2.1`, latest 0.5.5). Remove once
  #   both parents' ranges floor at `^1.2.2` (postcss 8.5.29 already does).
  # - launch-editor GHSA-587h-7wmj-h5pm (high), fixed in 2.14.2, via
  #   @changesets/cli (`^2.14.1`). Remove once that range floors at `^2.14.2`.
  "launch-editor@2": "^2.14.2"
  "shell-quote@1": "^1.11.0"
  "source-map-js@1": "^1.2.2"
nodeLinker: hoisted
allowBuilds:
  esbuild: true
  fallow: true
  msgpackr-extract: true
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"

# Supply-chain delay (owner's policy, gardeneria #1149): hold newly published
# versions for 1 day (unit: MINUTES) before pnpm will install them.
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  # @thomasfosterau/* is first-party — exempt so our own releases install immediately.
  - "@thomasfosterau/*"
