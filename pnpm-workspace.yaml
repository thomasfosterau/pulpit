# pnpm workspace — the published package plus the dist-consumer check.
#
# The `catalog:` protocol pins versions that MUST be singletons across the
# workspace. Effect especially: two copies of `effect` break Context / Layer /
# Schema identity at runtime, so every package references `catalog:`.
#
# EVERY external dependency version lives here — package.json files reference
# only `catalog:` / `catalog:peers` (or `workspace:*` for internal packages).
# `catalogMode: strict` makes `pnpm add` enforce this at add time and
# `pnpm install` reject non-catalog specifiers. After editing this catalog,
# ALWAYS run `pnpm install` and commit the regenerated pnpm-lock.yaml — a stale
# lockfile fails CI at once with ERR_PNPM_LOCKFILE_CONFIG_MISMATCH.
#
# Versions are kept in lockstep with the consuming applications' catalogs
# (the freshest, preferenceflow's, at scaffold time: effect, vite-plus, the
# TypeScript 6/7 pair, fallow) — the apps consume this library, so the library
# builds against exactly what they run.
packages:
  - packages/*
  - tests/*

catalogMode: strict

catalog:
  "@changesets/changelog-github": ^1.0.1
  "@changesets/cli": ^3.0.3
  "@effect/language-service": ^0.87.3
  # Effect Language Service as a native (TypeScript-Go) binary — the TS7 side
  # of the 6/7 split. `effect-tsgo patch` overwrites the native `tsc` binary
  # with an Effect-patched build matched by gitHead, so this pins in lockstep
  # with `@typescript/native` below (0.45.0 ships against typescript 7.0.2) and
  # with the `oxlint` that `vite-plus` pulls in: each @effect/tsgo release
  # ships artifacts for an explicit set of component versions and hard-errors
  # (UnsupportedTargetPackageVersionError) on anything else, failing `pnpm
  # install` itself rather than a later task — 0.45.0 supports oxlint 1.81.0 /
  # 1.82.0, which is why vite-plus is 0.3.1 below and not the 0.3.0 the apps
  # pin (0.3.0 carries oxlint 1.79.0, which 0.45.0 refuses). Read the
  # `components` table in node_modules/@effect/tsgo/dist/effect-tsgo.cjs before
  # bumping any of the three.
  "@effect/tsgo": 0.47.1
  "@mpsuesser/oxlint-plugin-effect": ^0.5.0
  # The JSON:API model layer the `./content` and `./registry` subpaths build on.
  "@thomasfosterau/effect-jsonapi": ^0.16.0
  "@types/node": ^26.4.1
  "@vitest/coverage-istanbul": 5.0.0
  effect: 4.0.0-rc.118
  effect-solutions: ^0.5.3
  fallow: 3.28.0
  # TypeScript 6/7 side-by-side: TS7 (the native Go compiler) ships no JS API
  # until 7.1, so JS-API consumers (@effect/language-service) stay on TS6 while
  # native `tsc` type-checks AND emits this library's `dist/`. The alias keeps
  # the package importable as `typescript` name-stable at the TS6 JS compiler
  # (bin `tsc6`); `@typescript/native` is TS7 (bin `tsc`). Pinned exact:
  # @typescript/native's gitHead must match @effect/tsgo's bundled binary.
  typescript: "npm:@typescript/typescript6@6.0.2"
  "@typescript/native": "npm:typescript@7.0.2"
  # vite-plus pins `oxlint`, `oxfmt` and `vitest` to exact versions, so this
  # entry — not a catalog entry of its own — is what decides the oxlint version
  # `effect-tsgo patch --oxlint` has to support (see the @effect/tsgo note
  # above): 0.3.0 carries oxlint 1.79.0, 0.3.1 carries 1.81.0. `vite` is the
  # same release under its aliased core package, and `vitest` must match
  # vite-plus's exact pin (0.3.1 → 4.1.11) because the `vitest: "catalog:"`
  # override forces every resolution to the catalog singleton.
  vite-plus: 0.3.1
  vite: npm:@voidzero-dev/vite-plus-core@0.3.1
  vitest: 4.1.11

# Peer ranges the PUBLISHED package declares. Kept as a named catalog so the
# strict catalog mode still governs them while they stay ranges (an exact
# `4.0.0-rc.118` peer would reject a consumer on a later prerelease). `pnpm publish`
# replaces `catalog:peers` with these ranges in the published manifest.
catalogs:
  peers:
    "@thomasfosterau/effect-jsonapi": ">=0.16.0"
    effect: ">=4.0.0-rc.118"

overrides:
  vite: "catalog:"
  vitest: "catalog:"
  # `effect` MUST be a singleton (see the header): force every resolution to
  # the catalog version so a hoisting reshuffle cannot introduce a second copy.
  effect: "catalog:"
  # `@mpsuesser/oxlint-plugin-effect` 0.5.0 is built on effect 4.0.0-beta.100
  # and calls `Schema.isIncludes` (renamed `isIncluding` in rc.118), so the
  # catalog `effect` override above makes `vite.config.ts` fail to load. Keep
  # the plugin on its own private beta.100 copy. Remove this once the plugin
  # ships an rc.118 build (website#2015).
  "@mpsuesser/oxlint-plugin-effect>effect": "4.0.0-beta.100"
nodeLinker: hoisted
allowBuilds:
  esbuild: true
  fallow: true
  msgpackr-extract: true
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"

# Supply-chain delay (owner's policy, gardeneria #1149): hold newly published
# versions for 1 day (unit: MINUTES) before pnpm will install them.
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  # @thomasfosterau/* is first-party — exempt so our own releases install immediately.
  - "@thomasfosterau/*"
