name: Auto-assign

# Assign the owner to every pull request opened without an assignee. No
# checkout and no third-party action: one `gh` call with the job's own token,
# whose inputs arrive through `env:`, never interpolated into the script.
# Dependabot's PRs are assigned by `.github/dependabot.yml` (`assignees`),
# and its token is read-only here, so the job skips them; a fork's PR gets a
# read-only token too, so it is skipped as well. The "chore: version
# packages" PR is opened by changesets/action with GITHUB_TOKEN, which
# triggers no workflow, so it is not assigned by this one.

on:
  pull_request:
    types: [opened, reopened, ready_for_review]

# No permissions by default; the one job grants only what assigning needs.
permissions: {}

jobs:
  assign:
    if: >-
      github.actor != 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      toJSON(github.event.pull_request.assignees) == '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Assign the owner
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr edit "$PR_URL" --add-assignee thomasfosterau
