name: Dev Container

# Builds .devcontainer/ as Codespaces does and checks the toolchain inside it.

on:
  pull_request:
    branches: [trunk]
    paths:
      - ".devcontainer/**"
      - "pnpm-workspace.yaml"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/devcontainer.yml"
  push:
    branches: [trunk]
    paths:
      - ".devcontainer/**"
      - "pnpm-workspace.yaml"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/devcontainer.yml"
  workflow_dispatch:

concurrency:
  group: devcontainer-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/trunk' }}

permissions: {}

jobs:
  devcontainer:
    name: build and provision
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      DEVCONTAINER_CLI: "@devcontainers/cli@0.89.0"
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          version-file: pnpm-workspace.yaml
          cache: true
          run-install: true
      - name: Build and start the container
        run: vp dlx "$DEVCONTAINER_CLI" up --workspace-folder .
      - name: Check the toolchain
        run: vp dlx "$DEVCONTAINER_CLI" exec --workspace-folder . bash -lc 'vp --version && node --version && test -x node_modules/.bin/vp'
