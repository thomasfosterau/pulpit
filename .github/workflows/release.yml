name: Release

# `select` picks the Changesets mode; `version` opens the version PR; `publish`
# runs in the protected `release` environment, the only job with `id-token`
# (npm trusted publishing). See docs/PUBLISHING.md.

on:
  push:
    branches: [trunk]

permissions: {}

jobs:
  # Nothing privileged runs unless .github/workflows/actions.lock verifies.
  verify-lockfile:
    name: Verify the actions lockfile
    if: github.repository == 'thomasfosterau/pulpit' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install gh-actions-lock
        run: gh extension install github/gh-actions-lock --pin v0.4.1
      - name: Verify the workflow lockfile
        run: gh actions-lock --verify

  select:
    name: Select mode
    needs: verify-lockfile
    if: github.repository == 'thomasfosterau/pulpit' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          version-file: pnpm-workspace.yaml
          node-version: lts
          cache: false
          # No dependency lifecycle scripts in release jobs.
          run-install: |
            - args: ["--frozen-lockfile", "--ignore-scripts"]
      - name: Select mode
        id: mode
        uses: changesets/action/select-mode@v2.1.2

  version:
    name: Version packages
    needs: [verify-lockfile, select]
    if: needs.select.outputs.mode == 'version'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: release-version-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: write
      pull-requests: write
    env:
      # Stop pnpm re-installing (with lifecycle scripts) mid-job when a manifest looks newer than node_modules.
      pnpm_config_verify_deps_before_run: "false"
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          version-file: pnpm-workspace.yaml
          node-version: lts
          cache: false
          run-install: |
            - args: ["--frozen-lockfile", "--ignore-scripts"]
      - name: Create or update the version PR
        uses: changesets/action/version@v2.1.2
        with:
          script: pnpm run version
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"

  publish:
    name: Publish to npm
    needs: [verify-lockfile, select]
    if: needs.select.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: release-publish-${{ github.ref }}
      cancel-in-progress: false
    environment: release
    permissions:
      contents: write
      id-token: write
    env:
      pnpm_config_verify_deps_before_run: "false"
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          version-file: pnpm-workspace.yaml
          node-version: lts
          cache: false
          run-install: |
            - args: ["--frozen-lockfile", "--ignore-scripts"]
      # The build runs on the Effect-patched tsc.
      - name: Patch the toolchain
        run: vp run prepare
      # `vp run release` (vite.config.ts): builds every package, publishes each
      # unpublished version with `vp pm publish -r` (pnpm rewrites `catalog:` /
      # `workspace:` specifiers, does OIDC trusted publishing itself and
      # attaches provenance on its own for a public repository), then
      # `changeset git-tag` reports the new tags through CHANGESETS_OUTPUT, and
      # the action pushes them and creates the releases.
      - name: Publish to npm
        uses: changesets/action/publish@v2.1.2
        with:
          script: vp run release
