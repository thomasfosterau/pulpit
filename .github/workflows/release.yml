name: Release

# Changesets release flow: on every push to `main`, changesets/action either
# opens/updates the "Version Packages" PR (when unreleased changesets exist)
# or, when that PR has merged and no changesets remain, publishes the package
# to npm and tags the release. Copied in shape from the effect-jsonapi library;
# see PUBLISHING.md for the one-time maintainer setup.

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}

# No permissions by default; the release job opts into exactly what it needs.
permissions: {}

jobs:
  release:
    name: Version or publish
    # Never run on forks (they have neither the environment nor the trusted
    # publisher binding, so a fork cannot publish on your behalf).
    if: github.repository == 'thomasfosterau/pulpit'
    runs-on: ubuntu-latest
    # Requires manual approval via a protected GitHub Environment named
    # "release". See PUBLISHING.md for the one-time setup.
    environment: release
    permissions:
      contents: write # push the version commit/tag and the "Version Packages" PR branch
      pull-requests: write # open/update the "Version Packages" PR
      id-token: write # OIDC: prove this workflow's identity to npm (no token needed)
    env:
      # pnpm 11 defaults `verify-deps-before-run` to `install`: before any
      # `pnpm run` / `pnpm exec` (`pnpm run prepare`, `pnpm exec vp run -r
      # build`, `pnpm run version` / `release` below) it compares node_modules
      # with the manifests and, if a manifest looks newer than the last
      # install, re-installs WITH lifecycle scripts, ignoring the
      # `--ignore-scripts` of the install step below. That re-install runs
      # every `allowBuilds` dependency's build script (`esbuild`, `fallow`,
      # `msgpackr-extract`) inside this job, which holds `id-token: write`. It
      # triggers whenever a manifest's mtime moves after the install step,
      # e.g. a `git checkout` / `git reset --hard` by the Changesets action
      # before `pnpm run version`. Scoped to this job: CI and local runs keep
      # the default. pnpm 11 reads only the `pnpm_config_*` spelling for this
      # setting; `npm_config_verify_deps_before_run` is ignored.
      pnpm_config_verify_deps_before_run: "false"
    steps:
      - name: Checkout
        # The Changesets action pushes the version branch, so it needs the
        # checkout's git credentials (the ephemeral, job-scoped GITHUB_TOKEN).
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Installs the pnpm version pinned by the package.json "packageManager"
      # field. Must run before setup-node so its pnpm cache can find the store.
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # --ignore-scripts stops a compromised dependency from running install
      # scripts in the privileged publish job (the Shai-Hulud vector). It only
      # holds because `pnpm_config_verify_deps_before_run` is off for this job
      # (see the job `env` above).
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # `--ignore-scripts` also skips this workspace's own `prepare` script
      # (`vp config && effect-tsgo patch --typescript --oxlint`), which is what
      # produces the Effect-patched native `tsc` the build runs under — so it
      # is run explicitly here. Note what that means: it is the one lifecycle
      # script that runs in this id-token job, and it is not only first-party
      # code — `effect-tsgo patch` executes the `@effect/tsgo` dependency (and
      # `vp config` installs the git hooks, which then run on the Changesets
      # action's version commit). Both are pinned by the lockfile.
      - name: Patch the toolchain (effect-tsgo)
        run: pnpm run prepare

      - name: Build
        run: pnpm exec vp run -r build

      # When changesets are pending, this opens/updates a "Version Packages" PR
      # (via `pnpm run version`). Once that PR is merged (no changesets remain),
      # it runs `pnpm run release`, which publishes with `pnpm publish
      # --ignore-scripts` (no package lifecycle script — `prepublishOnly`,
      # `prepack`, `publish`, … — runs in this job; none is defined today) —
      # pnpm 11 performs npm OIDC trusted publishing itself when the job holds
      # `id-token: write` and no token is configured (it no longer delegates
      # to the npm CLI, so npm is never upgraded here), and it (unlike
      # `npm publish`) rewrites the `catalog:` / `catalog:peers` specifiers and
      # applies `publishConfig.exports` in the published manifest — and then
      # `changeset tag`. The action parses the "New tag:" output, pushes the
      # tags and creates the GitHub releases.
      #
      # Provenance: pnpm 11 takes settings like `provenance` only from
      # `pnpm_config_*` (an `NPM_CONFIG_PROVENANCE` would be ignored), and
      # neither the release script nor this job sets it. Left unset, pnpm
      # attaches provenance by itself only when the OIDC token reports a
      # public repository AND the registry reports the package as public;
      # while this repository is private it skips it with a warning
      # (ERR_PNPM_PROVENANCE_INSUFFICIENT_INFORMATION). Forcing it on
      # (`--provenance`) skips that check, and npm rejects a provenance
      # statement from a private repository, failing the publish.
      #
      # v2 of the action pairs with Changesets CLI v3 (`@changesets/cli` in
      # devDependencies) and renamed its inputs from v1's `version` / `publish`
      # / `commit` / `title`.
      - name: Create release PR or publish to npm
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: pnpm run version
          publish-script: pnpm run release
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
