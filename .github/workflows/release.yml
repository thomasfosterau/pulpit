name: Release

# Changesets release flow, split so that only publishing waits for approval.
# On every push to `trunk`:
#
# - `select` (read-only) asks changesets/action/select-mode what the repo state
#   calls for: `version` while unreleased changesets exist, `publish` once none
#   remain and some package version is not on npm yet (`changeset
#   publish-plan`), else `none`.
# - `version` opens/updates the "chore: version packages" PR. It holds a
#   write-scoped token but no `id-token`, so it cannot publish, and runs outside
#   the `release` environment, so it needs no approval.
# - `publish` is the only job in the protected `release` environment and the
#   only one with `id-token: write`: it publishes to npm via OIDC trusted
#   publishing and tags the release, after the owner approves it (once per
#   release). See PUBLISHING.md.
#
# changesets/action's README recommends its sub-actions over the combined
# action for trusted publishing, "to tighten publish permissions"; they need
# Changesets CLI v3. The version and publish sub-actions push through the
# GitHub API, so no checkout keeps git credentials.

on:
  push:
    branches: [trunk]

# No permissions by default; each job opts into exactly what it needs.
permissions: {}

jobs:
  # Same setup as `publish` (see the comments there), minus the build.
  select:
    name: Select mode
    if: github.repository == 'thomasfosterau/pulpit' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
    env: &id001
      pnpm_config_verify_deps_before_run: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Vite+ provides Node.js and the pnpm that package.json's `packageManager`
      # names; the install stays the explicit `--ignore-scripts` step below.
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: "22"
          cache: true
          run-install: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Patch the toolchain (effect-tsgo)
        run: pnpm run prepare
      - name: Select mode
        id: mode
        uses: changesets/action/select-mode@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2

  version:
    name: Version packages
    needs: select
    if: needs.select.outputs.mode == 'version'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: release-version-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: write
      pull-requests: write
    env: *id001
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Vite+ provides Node.js and the pnpm that package.json's `packageManager`
      # names; the install stays the explicit `--ignore-scripts` step below.
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: "22"
          cache: true
          run-install: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Patch the toolchain (effect-tsgo)
        run: pnpm run prepare
      - name: Create or update the version PR
        uses: changesets/action/version@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          script: pnpm run version
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"

  publish:
    name: Publish to npm
    # Never run on forks (they have neither the environment nor the trusted
    # publisher binding, so a fork cannot publish on your behalf).
    # Never for Dependabot either: this job holds `id-token: write`, and only
    # the owner's merges to `trunk` may version or publish.
    # That guard is on `select` now: this job needs it, so it is skipped with it.
    needs: select
    if: needs.select.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # One publish at a time; never cancel one that has started.
    concurrency:
      group: release-publish-${{ github.ref }}
      cancel-in-progress: false
    # Requires manual approval via a protected GitHub Environment named
    # "release". See PUBLISHING.md for the one-time setup.
    environment: release
    permissions:
      contents: write # push the release tags and create the GitHub releases
      id-token: write # OIDC: prove this workflow's identity to npm (no token needed)
    env:
      # pnpm 11 defaults `verify-deps-before-run` to `install`: before any
      # `pnpm run` / `pnpm exec` (`pnpm run prepare`, `pnpm exec vp run -r
      # build`, `pnpm run version` / `release` below) it compares node_modules
      # with the manifests and, if a manifest looks newer than the last
      # install, re-installs WITH lifecycle scripts, ignoring the
      # `--ignore-scripts` of the install step below. That re-install runs
      # every `allowBuilds` dependency's build script (`esbuild`, `fallow`,
      # `msgpackr-extract`) inside this job, which holds `id-token: write`. It
      # triggers whenever a manifest's mtime moves after the install step,
      # e.g. a `git checkout` / `git reset --hard` by the Changesets action
      # before `pnpm run version`. Scoped to this job: CI and local runs keep
      # the default. pnpm 11 reads only the `pnpm_config_*` spelling for this
      # setting; `npm_config_verify_deps_before_run` is ignored.
      pnpm_config_verify_deps_before_run: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Vite+ provides Node.js and the pnpm that package.json's `packageManager`
      # names; the install stays the explicit `--ignore-scripts` step below.
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: "22"
          cache: true
          run-install: false

      # --ignore-scripts stops a compromised dependency from running install
      # scripts in the privileged publish job (the Shai-Hulud vector). It only
      # holds because `pnpm_config_verify_deps_before_run` is off for this job
      # (see the job `env` above).
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # `--ignore-scripts` also skips this workspace's own `prepare` script
      # (`vp config && effect-tsgo patch --typescript --oxlint`), which is what
      # produces the Effect-patched native `tsc` the build runs under — so it
      # is run explicitly here. Note what that means: it is the one lifecycle
      # script that runs in this id-token job, and it is not only first-party
      # code — `effect-tsgo patch` executes the `@effect/tsgo` dependency (and
      # `vp config` installs the git hooks, which then run on the Changesets
      # action's version commit). Both are pinned by the lockfile.
      - name: Patch the toolchain (effect-tsgo)
        run: pnpm run prepare

      - name: Build
        run: pnpm exec vp run -r build

      # Once the version PR has merged (no changesets remain), this runs `pnpm
      # run release`, which publishes with `pnpm publish --ignore-scripts` (no
      # package lifecycle script — `prepublishOnly`, `prepack`, `publish`, … —
      # runs in this job; none is defined today) — pnpm 11 performs npm OIDC
      # trusted publishing itself when the job holds `id-token: write` and no
      # token is configured (it no longer delegates to the npm CLI, so npm is
      # never upgraded here), and it (unlike `npm publish`) rewrites the
      # `catalog:` / `catalog:peers` / `workspace:` specifiers and applies
      # `publishConfig.exports` in the published manifest — and then `changeset
      # git-tag`, which creates one `<package>@<version>` tag per package
      # version not yet tagged and reports each in the file the action names in
      # `CHANGESETS_OUTPUT`; the action reads that file, pushes the tags and
      # creates one GitHub release per tag (one or two per release, with two
      # packages).
      #
      # Provenance: pnpm 11 takes settings like `provenance` only from
      # `pnpm_config_*` (an `NPM_CONFIG_PROVENANCE` would be ignored), and
      # neither the release script nor this job sets it. Left unset, pnpm
      # attaches provenance by itself only when the OIDC token reports a
      # public repository AND the registry reports the package as public;
      # while this repository is private it skips it with a warning
      # (ERR_PNPM_PROVENANCE_INSUFFICIENT_INFORMATION). Forcing it on
      # (`--provenance`) skips that check, and npm rejects a provenance
      # statement from a private repository, failing the publish.
      #
      # v2 of the action pairs with Changesets CLI v3 (`@changesets/cli` in
      # devDependencies) and renamed its inputs from v1's `version` / `publish`
      # / `commit` / `title`.
      - name: Publish to npm
        uses: changesets/action/publish@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          script: pnpm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
