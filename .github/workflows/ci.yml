name: CI

# ONE job, ONE required check: the pipeline's task graph lives in
# vite.config.ts (the root `check` task), not in GitHub Actions `needs:`.
# Copied in shape from the effect-drizzle-ext library (and through it the
# gardeneria application). There is no integration suite yet: the kernel is
# pure until its Drizzle-backed stores land (pulpit#4), at which point the
# `postgres` service container and the `test:integration` step come back
# from effect-drizzle-ext's copy of this file.

on:
  pull_request:
    branches: [trunk]
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [trunk]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/trunk' }}

# No permissions by default; the single job grants only read access.
permissions: {}

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      # A modest ceiling for every Node process in the pipeline. NODE_OPTIONS
      # is inherited by every child, including each vitest fork.
      NODE_OPTIONS: --max-old-space-size=2048
      VITEST_MAX_WORKERS: 2
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      # Vite+ at the catalog's `vite-plus` pin, Node.js, Vite+'s managed pnpm
      # (the `pnpm …` steps below) and the dependencies, installed from the
      # lockfile; the pnpm store is cached on pnpm-lock.yaml (pulpit#280).
      - name: Setup Vite+ and install dependencies
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          version-file: pnpm-workspace.yaml
          # Never `latest`: Vite+ resolves it to the newest entry of the
          # Node.js index, pre-releases included (a Node 27 alpha since
          # 2026-10-29). `lts` is the newest LTS release.
          node-version: lts
          cache: true
          run-install: |
            - args: ["--frozen-lockfile"]
      - name: Restore the Vite+ task cache
        uses: actions/cache@v6.1.0
        with:
          path: node_modules/.vite/task-cache
          key: vp-task-v1-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            vp-task-v1-${{ runner.os }}-
      # Format + lint, type-aware through oxlint-tsgolint (`lint.options` in
      # vite.config.ts), so this also runs the `typescript/*` and
      # `effecttsgo/*` type-aware rules and TypeScript's diagnostics.
      - name: Format and lint
        run: pnpm exec vp check
      - name: Type gates (packages + emitted declarations)
        run: pnpm exec vp run --concurrency-limit 2 check
      - name: Unit tests
        run: pnpm exec vp run -r test:unit
      # Every package's suite under its own coverage thresholds (90 / 85 /
      # 90 / 90, `vite.package.ts`), plus the root's merged Istanbul map (the
      # one `fallow audit` reads), so a package that drops below its
      # thresholds fails here (pulpit#166). It also guards the coverage
      # provider: vite-plus refuses to start a coverage run unless
      # `@vitest/coverage-istanbul` equals the vitest it bundles exactly, so a
      # toolchain bump that leaves the pin behind fails here, not on a
      # contributor's machine (pulpit#119).
      - name: Coverage (each package's thresholds)
        run: pnpm exec vp run -r test:coverage
      - name: Build
        run: pnpm exec vp run -r build
      # Type-checks AND runs every JSDoc @example, and generates the API docs.
      - name: Verify documentation examples (docgen)
        run: pnpm exec vp run -r docgen
      - name: Audit
        run: pnpm audit --audit-level high
