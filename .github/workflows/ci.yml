name: CI

# The gates are ONE job, ONE required check: the pipeline's task graph lives
# in vite.config.ts (the root `check` task), not in GitHub Actions `needs:`.
# Copied in shape from the effect-drizzle-ext library (and through it the
# gardeneria application). The second job, `integration`, runs
# pulpit-drizzle-pg's integration suite against a `postgres` service
# container; it is not one of the gates (AGENTS.md → Verification).

on:
  pull_request:
    branches: [trunk]
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [trunk]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/trunk' }}

# No permissions by default; the single job grants only read access.
permissions: {}

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      # A modest ceiling for every Node process in the pipeline. NODE_OPTIONS
      # is inherited by every child, including each vitest fork.
      NODE_OPTIONS: --max-old-space-size=2048
      VITEST_MAX_WORKERS: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Vite+ at the catalog's `vite-plus` pin, Node.js, Vite+'s managed pnpm
      # (the `pnpm …` steps below) and the dependencies, installed from the
      # lockfile; the pnpm store is cached on pnpm-lock.yaml (pulpit#280).
      - name: Setup Vite+ and install dependencies
        uses: voidzero-dev/setup-vp@0072dab61af1caed438a55cb90c8d6dc0dfa09ce # v1.22.0
        with:
          version-file: pnpm-workspace.yaml
          # Never `latest`: Vite+ resolves it to the newest entry of the
          # Node.js index, pre-releases included (a Node 27 alpha since
          # 2026-10-29). `lts` is the newest LTS release.
          node-version: lts
          cache: true
          run-install: |
            - args: ["--frozen-lockfile"]
      - name: Restore the Vite+ task cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.vite/task-cache
          key: vp-task-v1-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            vp-task-v1-${{ runner.os }}-
      # Format + lint, type-aware through oxlint-tsgolint (`lint.options` in
      # vite.config.ts), so this also runs the `typescript/*` and
      # `effecttsgo/*` type-aware rules and TypeScript's diagnostics.
      - name: Format and lint
        run: pnpm exec vp check
      - name: Type gates (packages + emitted declarations)
        run: pnpm exec vp run --concurrency-limit 2 check
      - name: Unit tests
        run: pnpm exec vp run -r test:unit
      # Every package's suite under its own coverage thresholds (90 / 85 /
      # 90 / 90, `vite.package.ts`), plus the root's merged Istanbul map (the
      # one `fallow audit` reads), so a package that drops below its
      # thresholds fails here (pulpit#166). It also guards the coverage
      # provider: vite-plus refuses to start a coverage run unless
      # `@vitest/coverage-istanbul` equals the vitest it bundles exactly, so a
      # toolchain bump that leaves the pin behind fails here, not on a
      # contributor's machine (pulpit#119).
      - name: Coverage (each package's thresholds)
        run: pnpm exec vp run -r test:coverage
      - name: Build
        run: pnpm exec vp run -r build
      # Type-checks AND runs every JSDoc @example, and generates the API docs.
      - name: Verify documentation examples (docgen)
        run: pnpm exec vp run -r docgen
      - name: Audit
        run: pnpm audit --audit-level high

  # pulpit-drizzle-pg's integration suite (`test:integration`): the kernel's
  # conformance suites against a real PostgreSQL. The service container is
  # the "reachable local server" `-pg/testing`'s `provisionTestDatabase`
  # resolves through the PG* variables, so the setup drops, recreates and
  # builds its own database there. Exact release tags, per the owner's rule
  # for actions this workflow adds.
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      NODE_OPTIONS: --max-old-space-size=2048
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Setup Vite+ and install dependencies
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          version-file: pnpm-workspace.yaml
          node-version: lts
          cache: true
          run-install: |
            - args: ["--frozen-lockfile"]
      - name: Integration tests (pulpit-drizzle-pg, PostgreSQL)
        run: pnpm exec vp run --filter ./packages/pulpit-drizzle-pg test:integration
