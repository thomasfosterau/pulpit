# Run with `uvx zizmor --offline .github`.
rules:
  dependabot-cooldown:
    config:
      # Matches Dependabot's cooldown; pnpm's minimumReleaseAge is 8 hours.
      days: 1
  unpinned-uses:
    config:
      # Exact release tags; .github/workflows/actions.lock pins their commits.
      policies:
        "*": ref-pin
