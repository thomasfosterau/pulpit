# Dependabot version updates. The `npm` ecosystem at `/` reads the pnpm
# workspace, its catalogs and pnpm-lock.yaml.
#
# Dependabot puts a dependency in the FIRST group that matches it, so the
# groups run specific → general, and `exclude-patterns` keep each package out
# of a broader group it would otherwise also match.
#
# Lockstep groups (every update type, majors included, because a partial move
# breaks the build):
# - `toolchain`: vite-plus pins the `vite` core, `vitest`, `oxlint`, `oxfmt`
#   and `oxlint-tsgolint` it carries to exact versions; `@vitest/coverage-
#   istanbul` must equal that vitest (vite-plus refuses a coverage run
#   otherwise, pulpit#119); and `effect-tsgo patch` (the root `prepare`)
#   matches the native `tsc` (`@typescript/native`) and that oxlint by gitHead
#   and hard-errors (UnsupportedTargetPackageVersionError) on any pairing its
#   components table lacks, failing `pnpm install` itself. The TS6 alias
#   (`typescript`, published as `@typescript/typescript6`) and the Effect lint
#   plugin (`@enfect/oxlint`, an oxlint JS plugin) ride along. When this
#   group's PR goes red on install, pick the @effect/tsgo release whose
#   `components` table (node_modules/@effect/tsgo/dist/effect-tsgo.cjs)
#   covers the new oxlint / tsgolint / TypeScript, by hand on the same
#   branch (see the catalog comments in pnpm-workspace.yaml).
# - `effect`: the Effect 4 release line is one lockstep-versioned singleton
#   set (the `effect` override forces one copy). Excludes @effect/tsgo
#   (toolchain) and @effect/docgen (docgen).
# - `docgen`: @effect/docgen executes every `@example` under `tsx` and parses
#   `src/` with the ts-morph it bundles.
# - `changesets`: the CLI and its changelog formatter.
# - `fallow`: alone, because the PreToolUse gate (.claude/hooks/fallow-gate.sh)
#   and the AGENTS.md fallow blocks are hand-maintained against a checked
#   fallow version; check a bump against them (AGENTS.md → Fallow local gate)
#   and never regenerate them with `fallow hooks install` / `setup-hooks` /
#   `agent install`.
#
# Everything else shares one `minor-and-patch` group; a major outside the
# lockstep sets stays its own PR.
#
# By hand, because Dependabot cannot move them (AGENTS.md → Common pitfalls):
# - the npm-alias catalog entries: `vite` (`npm:@voidzero-dev/vite-plus-core@…`,
#   always the `vite-plus` version), and `typescript` / `@typescript/native`
#   (a pairing `@effect/tsgo`'s components table supports). Set them on the
#   toolchain group's branch.
# - the security floors in pnpm-workspace.yaml's `overrides` (undici,
#   shell-quote, source-map-js, launch-editor): transitive pins, deleted once
#   their parents' ranges carry the fix.
#
# `cooldown` is 1 day (Dependabot takes whole days only), longer than
# pnpm-workspace.yaml's `minimumReleaseAge` of 480 minutes (8 hours), so a
# Dependabot PR never proposes a version pnpm would still refuse. The
# first-party `@thomasfosterau/*` is exempt from both, as
# `minimumReleaseAgeExclude` is.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "trunk"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
    cooldown:
      default-days: 1
      exclude:
        - "@thomasfosterau/*"
    groups:
      toolchain:
        applies-to: version-updates
        patterns:
          - "vite-plus"
          - "vite"
          - "vitest"
          - "@vitest/*"
          - "oxlint"
          - "oxfmt"
          - "oxlint-tsgolint"
          - "@effect/tsgo"
          - "@typescript/native"
          - "typescript"
          - "@typescript/typescript6"
          - "@enfect/oxlint"
        update-types: ["major", "minor", "patch"]
      docgen:
        applies-to: version-updates
        patterns:
          - "@effect/docgen"
          - "tsx"
          - "ts-morph"
        update-types: ["major", "minor", "patch"]
      effect:
        applies-to: version-updates
        patterns:
          - "effect"
          - "@effect/*"
        exclude-patterns:
          - "@effect/tsgo"
          - "@effect/docgen"
        update-types: ["major", "minor", "patch"]
      changesets:
        applies-to: version-updates
        patterns:
          - "@changesets/*"
        update-types: ["major", "minor", "patch"]
      fallow:
        applies-to: version-updates
        patterns:
          - "fallow"
        update-types: ["major", "minor", "patch"]
      minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        exclude-patterns:
          - "vite-plus"
          - "vite"
          - "vitest"
          - "@vitest/*"
          - "oxlint"
          - "oxfmt"
          - "oxlint-tsgolint"
          - "@typescript/native"
          - "typescript"
          - "@typescript/typescript6"
          - "@enfect/oxlint"
          - "effect"
          - "@effect/*"
          - "tsx"
          - "ts-morph"
          - "@changesets/*"
          - "fallow"
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    # The workflows and the composite setup action both pin actions by SHA.
    directories:
      - "/"
      - "/.github/actions/setup"
    target-branch: "trunk"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
    cooldown:
      default-days: 1
    groups:
      github-actions:
        patterns:
          - "*"
