# Composite setup shared by every CI job that needs the toolchain.
# Sets up Node.js + pnpm, restores the pnpm store cache (keyed on
# pnpm-lock.yaml by setup-node), and installs dependencies with a frozen
# lockfile (retried — see the Install step's own comment for why).
# `vp` and the dev bins land in node_modules/.bin; later steps call them as
# `pnpm exec vp …` (this action does not write GITHUB_PATH, which zizmor
# flags as an environment-injection vector). Copied from gardeneria's action.
#
# Callers must run `actions/checkout` BEFORE this (a local composite action
# needs the repo on disk first).
name: Setup toolchain
description: Set up Node.js and pnpm, restore the package cache, and install dependencies.
runs:
  using: composite
  steps:
    # pnpm before Node so setup-node's `cache: pnpm` can resolve the store path.
    # The pnpm version comes from the `packageManager` field in package.json.
    - name: Setup pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        # Never `latest`: setup-node resolves it to the first entry of the
        # nodejs.org index, pre-releases included (a Node 27 alpha since
        # 2026-10-29). `"*"` with `check-latest` is the newest stable release.
        node-version: "*"
        check-latest: true
        cache: pnpm

    # The install is retried (3 attempts, 15 s / 30 s backoff) as a mitigation
    # for a transient race in pnpm's own linker, seen once in gardeneria CI
    # (gardeneria run 30191408746) on a cold store cache. Do not collapse it
    # back to a bare `pnpm install`. `--frozen-lockfile` and install scripts
    # still run on every attempt, so a deterministic failure (lockfile drift,
    # a policy violation) still fails all three attempts and turns the job red.
    - name: Install dependencies
      shell: bash
      run: |
        for attempt in 1 2 3; do
          if pnpm install --frozen-lockfile; then
            break
          fi
          if [ "$attempt" -eq 3 ]; then
            echo "::error::pnpm install failed after 3 attempts"
            exit 1
          fi
          delay=$((attempt * 15))
          echo "::warning::pnpm install failed (attempt ${attempt}/3); retrying in ${delay}s"
          sleep "$delay"
        done
