# Composite setup shared by every CI job that needs the toolchain.
# Sets up Vite+ with voidzero-dev/setup-vp (pulpit#280), which installs `vp`
# at the catalog's `vite-plus` pin, the Node.js runtime, and Vite+'s managed
# pnpm (so `pnpm …` steps keep working), restores the pnpm store cache keyed
# on pnpm-lock.yaml, then installs dependencies with a frozen lockfile
# (retried — see the Install step's own comment for why). setup-vp puts `vp`
# on PATH itself, as setup-node did for `node`; no step here writes
# GITHUB_PATH, which zizmor flags as an environment-injection vector.
# Copied in shape from gardeneria's action.
#
# Callers must run `actions/checkout` BEFORE this (a local composite action
# needs the repo on disk first).
name: Setup toolchain
description: Set up Vite+, Node.js and pnpm, restore the package cache, and install dependencies.
runs:
  using: composite
  steps:
    - name: Setup Vite+
      uses: voidzero-dev/setup-vp@0072dab61af1caed438a55cb90c8d6dc0dfa09ce # v1.22.0
      with:
        # The `vite-plus` entry of the catalog: the version the lockfile and
        # the session hook use.
        version-file: pnpm-workspace.yaml
        # Never `latest`: Vite+ resolves it to the newest release in the
        # Node.js index, pre-releases included (a Node 27 alpha since
        # 2026-10-29). `lts` is the newest LTS release, today the newest
        # stable one too (26.x); setup-node's `"*"` + `check-latest` picked
        # the same release.
        node-version: lts
        # The pnpm store, keyed on pnpm-lock.yaml.
        cache: true
        # Installed below, with retries.
        run-install: false

    # The install is retried (3 attempts, 15 s / 30 s backoff) as a mitigation
    # for a transient race in pnpm's own linker (`vp install` runs pnpm), seen once in gardeneria CI
    # (gardeneria run 30191408746) on a cold store cache. Do not collapse it
    # back to a bare `pnpm install`. `--frozen-lockfile` and install scripts
    # still run on every attempt, so a deterministic failure (lockfile drift,
    # a policy violation) still fails all three attempts and turns the job red.
    - name: Install dependencies
      shell: bash
      run: |
        for attempt in 1 2 3; do
          if vp install --frozen-lockfile; then
            break
          fi
          if [ "$attempt" -eq 3 ]; then
            echo "::error::vp install failed after 3 attempts"
            exit 1
          fi
          delay=$((attempt * 15))
          echo "::warning::vp install failed (attempt ${attempt}/3); retrying in ${delay}s"
          sleep "$delay"
        done
